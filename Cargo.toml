[workspace]
members = ["census"]

# The adapter is a workspace member rather than a module, so the core keeps the
# empty dependency list that lets its release build offline straight from
# source (call/0011). The canonical artifact is built with `-p calx-telltale`
# and never includes the adapter.

[package]
name = "calx-telltale"
version = "0.5.3"
edition = "2021"
# Held below the toolchain the host builds with, because the model checker
# ships its own and refuses a crate that demands a newer one.
rust-version = "1.85"
license = "Unlicense"
description = "A verified calculator for waits, interrupts-off windows, and the compositions built out of them"
repository = "https://github.com/slartibardfast/calx-telltale"

# No dependencies. The verified core is arithmetic over integer intervals, and a
# dependency here would be a dependency inside the proof boundary.
[lib]
name = "calx_telltale"
path = "src/lib.rs"

[[bin]]
name = "calx-telltale"
path = "src/main.rs"

[dependencies]

[profile.release]
strip = true

# `kani` is set by the model checker rather than by cargo, so it has to be
# declared or every build warns about the proof module's gate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
